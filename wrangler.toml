#:schema node_modules/wrangler/config-schema.json
name = "metakaizen"
compatibility_date = "2024-11-06"

# Static assets (the Vite build output) served as a SPA.
# Any unknown route falls back to index.html so client-side routing
# works for /hub, /hangar, /dojo, etc.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
